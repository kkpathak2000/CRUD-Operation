<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Pollos Hermanos - Inventory Management</title>
    <link type="text/css" rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/ae/Los_Pollos_Hermanos_logo.png" alt="Los Pollos Hermanos Logo">
        </div>
    </header>

    <main class="flex-container">
        <section class="dashboard-section">
            <div class="dash-card">
                <span class="dash-label">Total Products</span>
                <span class="dash-value" id="totalProducts">0</span>
            </div>
            <div class="dash-card">
                <span class="dash-label">Total Quantity</span>
                <span class="dash-value" id="totalQty">0</span>
            </div>
            <div class="dash-card">
                <span class="dash-label">Total Value</span>
                <span class="dash-value" id="totalValue">$0.00</span>
            </div>
        </section>

        <section class="form-section">
            <h2>Product Form</h2>
            <form autocomplete="off" id="productForm">
                <div class="form-group">
                    <label for="productCode">Product Code</label>
                    <input type="text" name="productCode" id="productCode" required placeholder="e.g. METH-01">
                </div>
                <div class="form-group">
                    <label for="product">Product Name</label>
                    <input type="text" name="product" id="product" required placeholder="e.g. Blue Sky">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select name="category" id="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Chemicals">Chemicals</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Packaging">Packaging</option>
                        <option value="Distribution">Distribution</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="qty">Quantity</label>
                    <input type="number" name="qty" id="qty" required placeholder="0">
                </div>
                <div class="form-group">
                    <label for="perPrice">Price ($)</label>
                    <input type="number" name="perPrice" id="perPrice" required placeholder="0.00">
                </div>

                <div class="form-action-buttons">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>
            </form>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>Inventory List</h2>
                <div class="list-actions">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search products...">
                    </div>
                    <button id="exportBtn" class="action-btn">Export CSV</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="list" id="storeList">
                    <thead>
                        <tr>
                            <th>Product Code</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
